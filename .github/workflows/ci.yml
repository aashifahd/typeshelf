name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Check and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm can skip Electron's download script; fetch the binary if it's missing.
      - name: Make sure the Electron binary is present
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { node node_modules/electron/install.js }

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Checks the real Google Fonts Developer API response format. Skipped when
      # the secret isn't available (e.g. pull requests from forks).
      - name: Live Google Fonts API test
        run: npx vitest run tests/live-providers.test.ts -t "Developer API"
        env:
          LIVE: '1'
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}

      - name: Third-party licences
        run: npm run notices:check

      - name: Build installer
        run: npm run dist -- --publish never
        env:
          # Restricted Google Fonts Developer API key (repository secret). Builds
          # without it fall back to the undocumented fonts.google.com endpoints.
          MAIN_VITE_GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Typeshelf-installer-${{ github.sha }}
          path: dist/Typeshelf-Setup-*.exe
          retention-days: 14
          if-no-files-found: error

  e2e:
    name: End-to-end tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make sure the Electron binary is present
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { node node_modules/electron/install.js }

      - name: Build
        run: npm run build

      # Drives the real app: library, search, detail tabs, folder + Windows
      # activation, session mode, settings, Google Fonts install, automatic
      # update, rollback, uninstall and the uninstaller's font cleanup.
      - name: End-to-end tests
        run: npx playwright test
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ github.sha }}
          path: test-results/
          retention-days: 14

  self-update:
    name: App self-update (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make sure the Electron binary is present
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { node node_modules/electron/install.js }

      - name: Build app
        run: npm run build

      # Two installers from the same code: "old" (package.json version) and
      # "new" (version + 0.0.1), both pointing at a local update server.
      - name: Build old and new installers
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $p = $v.Split('.'); $p[2] = [int]$p[2] + 1; $next = $p -join '.'
          $env:SELFUPDATE_VERSION = $v;    $env:SELFUPDATE_OUT = 'dist-old'; npx electron-builder --win --publish never --config scripts/ci/builder-selfupdate.cjs
          $env:SELFUPDATE_VERSION = $next; $env:SELFUPDATE_OUT = 'dist-new'; npx electron-builder --win --publish never --config scripts/ci/builder-selfupdate.cjs
          "OLD_INSTALLER=dist-old/Typeshelf-Setup-$v.exe" >> $env:GITHUB_ENV

      - name: Install old version, update to new version
        run: node scripts/ci/self-update-test.mjs ${{ env.OLD_INSTALLER }} dist-new
