name: Bug report
description: Something in Typeshelf doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please check the existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Typeshelf version
      description: Shown in Settings → About.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other (please say in the description)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the last lines of `%APPDATA%\Typeshelf\logs\main.log`, or attach the file.
      render: text
